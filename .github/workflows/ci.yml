name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: maven:3.9-eclipse-temurin-17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools for the generator step
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3 python3-yaml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Generated code is up to date
        run: |
          python3 scripts/gen_operations.py
          mvn -B -q -Pgenerate generate-sources
          rm -rf api gradle
          git diff --exit-code -- src/main/java
      - run: mvn -B test
